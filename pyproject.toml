[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "room-reconstruction"
version = "0.1.0"
description = "Turn a handheld room video into a Gaussian-splat reconstruction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Allen" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
web = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29"]

[project.scripts]
room-reconstruct = "room_reconstruction.cli:main"
room-reconstruct-web = "room_reconstruction.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
